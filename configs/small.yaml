# Small model and small datasets for development on a CPU. Batch size = accum_steps * micro_batch_size = 16.
model:
  embed_dim: 64
  col_num_blocks: 1
  row_num_blocks: 1
  icl_num_blocks: 3
  col_nhead: 4
  row_nhead: 4
  icl_nhead: 4
  n_cls_rows: 32
data:
  task: classification
  n_targets: 2
  micro_batch_size: 4
  min_seq_len: 64
  max_seq_len: 256
  max_features: 20
  num_workers: 4
optim:
  lambda_fg: 0.0
  max_steps: 20000  # safety budget; normally stop on validation convergence
  accum_steps: 4
  lr: 1.0e-3
  warmup_steps: 100
  min_lr: 1.0e-5
  lr_factor: 0.3
validation:
  n_tables: 128
  seed: 1729
  every: 100
  patience: 5
  min_delta: 0.001
seed: 0
out_dir: runs/small_convergence
log_every: 5
save_every: 50
